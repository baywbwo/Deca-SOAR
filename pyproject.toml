[project]
name = "hypersoar"
version = "0.1.0"
description = "HyperSoar: ingest gateway (pull), Temporal alert workflow, action broker (shadow-only), audit ledger"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic>=2.8,<3",
    "pyyaml>=6,<7",
    "cryptography>=43",
    "httpx>=0.27,<1",
    "temporalio>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
hypersoar = "hypersoar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypersoar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
