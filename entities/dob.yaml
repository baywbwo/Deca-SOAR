# Entity config: one HyperSoar install per company. This file is PT Delta Omega Beta (DOB).
# No secret here. The integration blocks are the first version of each integration's settings: the
# broker copies them into its database on first start and screen 08 edits them from then on. Secrets
# (Lark app secret, Jira API token, 9router API key) are set write-only through the broker and stored
# sealed; a key that looks like a secret is rejected. Sandbox and production point at different targets.
version: 1
id: dob
name: PT Delta Omega Beta
short: DOB
timezone: Asia/Jakarta
cloud:
  provider: alibaba
  region: ap-southeast-5
  region_label: Alibaba Cloud Jakarta
  # Where every attack arc lands on the console map (worldmap.svg coordinates, 1200x508).
  map_xy: [915.5, 317.2]

# Correlation (G1): alerts sharing a source IP, principal or AccessKey within this window join one case.
correlation:
  window_s: 3600

# Asset criticality 1..5 feeds case priority (highest severity x criticality). `protected: true` means
# the broker never isolates or changes it automatically, whatever the alert says.
assets:
  - {name: merchant-login.qash, kind: waf_domain, criticality: 5, protected: false}
  - {name: api.qash, kind: waf_domain, criticality: 5, protected: false}
  - {name: portal.dob, kind: waf_domain, criticality: 3, protected: false}
  - {name: ecs-web-02, kind: ecs, instance_id: i-dobweb02, criticality: 4, protected: false}
  - {name: ecs-pay-01, kind: ecs, instance_id: i-dobpay01, criticality: 5, protected: true}
  - {name: ram-console, kind: ram, criticality: 5, protected: false}
  - {name: oss-backup, kind: oss, criticality: 4, protected: true}
default_criticality: 2

targets:
  sandbox:
    alibaba_account: sandbox-dob
    waf_instance: waf-jkt-01
    lark:
      target: mock
      settings:
        app_id: cli_sandboxdob0001
        routing:
          critical: {chat_id: oc_sandboxsocdob, chat_name: "SOC DOB · Alerts", oncall_dm: true, delivery: now}
          high: {chat_id: oc_sandboxsocdob, chat_name: "SOC DOB · Alerts", oncall_dm: false, delivery: now}
          medium: {chat_id: oc_sandboxsocdob, chat_name: "SOC DOB · Alerts", oncall_dm: false, delivery: digest_30m}
          low: {chat_id: oc_sandboxsocdob, chat_name: "SOC DOB · Alerts", oncall_dm: false, delivery: "off"}
        # Who may approve an L2 action from the Lark card, in order. After the last step the request
        # expires: nothing runs, the case stays open and the Jira issue gets a comment.
        ladder:
          - role: On-call analyst
            timeout_min: 5
            approvers:
              - {name: Rina Hartono, lark_user_id: ou_sandboxrina}
              - {name: Dimas Putra, lark_user_id: ou_sandboxdimas}
          - role: SOC lead
            timeout_min: 10
            approvers: [{name: Bayu Saputra, lark_user_id: ou_sandboxbayu}]
          - role: Head of IT
            timeout_min: 15
            approvers: [{name: Andi Wirawan, lark_user_id: ou_sandboxandi}]
    jira:
      target: mock
      settings:
        site: https://jira.sandbox.invalid
        email: soar-bot@dob.example
        project: SEC
        issue_type: Security Incident
        title_template: "[{severity}] {case_id} {case_title}"
        priority_map: {critical: Highest, high: High, medium: Medium, low: Low}
        sync: {comment_on_update: true, done_on_close: true, close_case_on_done: false}
    ai:
      target: mock
      settings:
        base_url: https://9router.sandbox.invalid/v1
        triage_model: deca-triage-v2
        fallback_model: deca-lite
        timeout_s: 20
        daily_token_limit: 2000000
  production:
    alibaba_account: REPLACE_WITH_DOB_ACCOUNT_ID
    waf_instance: REPLACE_WITH_WAF_INSTANCE
    # Production may only use live targets. Preflight fails until every integration has its secrets
    # set and a passing connection test for its current settings.
    lark:
      target: live
      settings:
        app_id: cli_REPLACEWITHAPPID
        routing:
          critical: {chat_id: oc_REPLACEWITHCHAT, chat_name: "SOC DOB · Alerts", oncall_dm: true, delivery: now}
          high: {chat_id: oc_REPLACEWITHCHAT, chat_name: "SOC DOB · Alerts", oncall_dm: false, delivery: now}
          medium: {chat_id: oc_REPLACEWITHCHAT, chat_name: "SOC DOB · Alerts", oncall_dm: false, delivery: digest_30m}
          low: {chat_id: oc_REPLACEWITHCHAT, chat_name: "SOC DOB · Alerts", oncall_dm: false, delivery: "off"}
        ladder:
          - role: On-call analyst
            timeout_min: 5
            approvers: [{name: REPLACE, lark_user_id: ou_REPLACEONCALL}]
          - role: SOC lead
            timeout_min: 10
            approvers: [{name: REPLACE, lark_user_id: ou_REPLACELEAD}]
          - role: Head of IT
            timeout_min: 15
            approvers: [{name: REPLACE, lark_user_id: ou_REPLACEHEAD}]
    jira:
      target: live
      settings:
        site: https://REPLACE-WITH-SITE.atlassian.net
        email: REPLACE@dob.example
        project: SEC
        issue_type: Security Incident
        title_template: "[{severity}] {case_id} {case_title}"
        priority_map: {critical: Highest, high: High, medium: Medium, low: Low}
        sync: {comment_on_update: true, done_on_close: true, close_case_on_done: false}
    ai:
      target: live
      settings:
        base_url: https://REPLACE-WITH-9ROUTER-HOST/v1
        triage_model: deca-triage-v2
        fallback_model: deca-lite
        timeout_s: 20
        daily_token_limit: 2000000
