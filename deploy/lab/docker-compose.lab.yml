# Lab overlay: the production stack of deploy/deca/docker-compose.yml on one VM, with stand-ins for what
# phase 0 gets from Alibaba Cloud. Never use this file in production. The lab runs two separate stacks,
# each with its own database, secrets, network and console URL; this file is what they share, and one of
# deploy/lab/docker-compose.sandbox.yml or docker-compose.production.yml picks the mode:
#   sandbox:    docker compose -p deca-lab -f deploy/deca/docker-compose.yml -f deploy/lab/docker-compose.lab.yml \
#                 -f deploy/lab/docker-compose.sandbox.yml --env-file /etc/deca-soar/deca.env up -d
#   production: docker compose -p deca-prod -f deploy/deca/docker-compose.yml -f deploy/lab/docker-compose.lab.yml \
#                 -f deploy/lab/docker-compose.production.yml --env-file /etc/deca-soar-prod/deca.env up -d
# Per stack in deca.env: HYPERSOAR_ETC (secrets/TLS directory) and HYPERSOAR_LAB_NET (first three octets of
# its /24). Stand-ins: postgres (RDS), temporal (the systemd Temporal host), the anchor file stays local (no
# Logtail/SLS). Additions for the owner: console (SOC console, writes through the broker) behind a
# Cloudflare quick tunnel; nothing here publishes a host port.
# Postgres, Temporal and the broker are reachable only inside the stack's network (review N1/N5).
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 20m, max-file: "3"}

services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/run/secrets/pg_tls_cert",
              "-c", "ssl_key_file=/run/secrets/pg_tls_key", "-c", "hba_file=/run/secrets/pg_hba",
              "-c", "password_encryption=scram-sha-256", "-c", "log_statement=none", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets: [pg_tls_cert, pg_tls_key, pg_hba, pg_superuser_password]
    volumes: [pgdata:/var/lib/postgresql]
    networks:
      deca: {ipv4_address: "${HYPERSOAR_LAB_NET:-172.30.124}.11"}
    healthcheck:
      test: ["CMD", "gosu", "postgres", "pg_isready", "-q", "-h", "/var/run/postgresql"]
      interval: 10s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}

  temporal:
    <<: *hardened
    image: ${HYPERSOAR_LAB_TEMPORAL_IMAGE:-deca-lab-temporal:1.32.2}
    environment:
      TEMPORAL_DB_PASSWORD_FILE: /etc/deca-soar/temporal/tls/db_password
      LOG_LEVEL: warn
      NUM_HISTORY_SHARDS: "4"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      SQL_TLS_ENABLED: "true"
      SQL_HOST_VERIFICATION: "true"
      SQL_CA: /etc/deca-soar/temporal/tls/server-ca.pem
      SQL_HOST_NAME: postgres
      BIND_ON_IP: "${HYPERSOAR_LAB_NET:-172.30.124}.10"
      TEMPORAL_TLS_SERVER_CERT: /etc/deca-soar/temporal/tls/server.pem
      TEMPORAL_TLS_SERVER_KEY: /etc/deca-soar/temporal/tls/server.key
      TEMPORAL_TLS_CA_CERT: /etc/deca-soar/temporal/tls/server-ca.pem
      TEMPORAL_TLS_SERVER_NAME: temporal.deca.internal
      TEMPORAL_TLS_CLIENT_CA_CERT: /etc/deca-soar/temporal/tls/client-ca.pem
      TEMPORAL_TLS_SYSTEM_WORKER_CERT: /etc/deca-soar/temporal/tls/system-worker.pem
      TEMPORAL_TLS_SYSTEM_WORKER_KEY: /etc/deca-soar/temporal/tls/system-worker.key
    volumes: ["${HYPERSOAR_ETC:-/etc/deca-soar}/lab/temporal:/etc/deca-soar/temporal/tls:ro"]
    networks:
      deca: {ipv4_address: "${HYPERSOAR_LAB_NET:-172.30.124}.10"}
    depends_on:
      postgres: {condition: service_healthy}

  broker:
    environment:
      # protected.yaml still holds the repo's RFC5737 placeholders, which the broker refuses under
      # HYPERSOAR_ENV=production. The mode (sandbox or production) comes from the overlay.
      HYPERSOAR_ENV: lab
    secrets: [deca_db_ca]
    ports: !reset []
    networks:
      deca: {ipv4_address: "${HYPERSOAR_LAB_NET:-172.30.124}.12"}
    depends_on:
      postgres: {condition: service_healthy}

  gateway:
    # HYPERSOAR_ENV=production would (rightly) refuse a sandbox install. The Temporal mTLS and payload key
    # files of the base file stay set, so the gateway still uses them.
    environment:
      HYPERSOAR_ENV: lab
    secrets: [deca_db_ca]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_started}

  worker:
    depends_on:
      temporal: {condition: service_started}
      broker: {condition: service_started}

  ledger-anchor:
    secrets: [deca_db_ca]

  console:
    <<: *hardened
    image: ${HYPERSOAR_IMAGE:?e.g. hypersoar:<git-sha>}
    command: ["uvicorn", "hypersoar.console.app:app", "--host", "0.0.0.0", "--port", "8300", "--no-server-header",
              "--no-proxy-headers", "--ssl-certfile", "/run/secrets/console_tls_cert",
              "--ssl-keyfile", "/run/secrets/console_tls_key"]
    environment:
      HYPERSOAR_ENV: production
      HYPERSOAR_DB_URL_FILE: /run/secrets/deca_db_url_console
      HYPERSOAR_CONSOLE_PASSWORD_HASH_FILE: /run/secrets/console_password_hash
      HYPERSOAR_CONSOLE_USER: ${HYPERSOAR_CONSOLE_USER:-owner}
      # Only the tunnel may set the client address used by the login rate limit.
      HYPERSOAR_CONSOLE_TRUSTED_PROXIES: "${HYPERSOAR_LAB_NET:-172.30.124}.30/32"
      HYPERSOAR_GIT_SHA: ${HYPERSOAR_GIT_SHA:-unknown}
      # Writes (approve, kill switch, case triage, revoke) go to the broker as the human principal named
      # like HYPERSOAR_CONSOLE_USER; the broker checks the re-typed password against its own hash.
      HYPERSOAR_BROKER_URL: https://broker:8100
      HYPERSOAR_BROKER_TOKEN_FILE: /run/secrets/deca_broker_console_token
      HYPERSOAR_BROKER_CA_FILE: /run/secrets/broker_tls_ca
    secrets: [deca_db_url_console, deca_db_ca, console_password_hash, console_tls_cert, console_tls_key,
              deca_broker_console_token, broker_tls_ca]
    networks:
      deca: {ipv4_address: "${HYPERSOAR_LAB_NET:-172.30.124}.20"}
    depends_on:
      postgres: {condition: service_healthy}
      broker: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;urllib.request.urlopen('https://127.0.0.1:8300/healthz',timeout=3,context=ssl._create_unverified_context())"]
      interval: 30s

  # Public HTTPS for the console without opening a port on the VM: a Cloudflare quick tunnel (free, no
  # account; the trycloudflare URL changes on every restart; each stack has its own). Origin TLS is verified against the lab CA.
  tunnel:
    <<: *hardened
    image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "https://console:8300",
              "--origin-ca-pool", "/run/secrets/console_ca", "--origin-server-name", "console"]
    secrets: [console_ca]
    networks:
      deca: {ipv4_address: "${HYPERSOAR_LAB_NET:-172.30.124}.30"}
    depends_on:
      console: {condition: service_healthy}

networks:
  deca:
    ipam:
      config: [{subnet: "${HYPERSOAR_LAB_NET:-172.30.124}.0/24"}]

volumes:
  pgdata: {}

secrets:
  deca_db_url_broker: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/secrets/deca_db_url_broker"}
  deca_db_ca: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/tls/db-ca.pem"}
  deca_db_url_console: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/secrets/deca_db_url_console"}
  deca_broker_console_token: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/secrets/deca_broker_console_token"}
  console_password_hash: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/secrets/console_password_hash"}
  console_tls_cert: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/tls/console.pem"}
  console_tls_key: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/secrets/console.key"}
  console_ca: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/tls/console-ca.pem"}
  pg_tls_cert: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/lab/postgres/server.pem"}
  pg_tls_key: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/lab/postgres/server.key"}
  pg_hba: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/lab/postgres/pg_hba.conf"}
  pg_superuser_password: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/lab/postgres/superuser_password"}
