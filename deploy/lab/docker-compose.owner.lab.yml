# Lab only: lets the owner job of deploy/deca/docker-compose.owner.yml reach the lab's Postgres container
# and verify its certificate. Used through deca-owner-run.sh with HYPERSOAR_OWNER_COMPOSE_OVERRIDE set to this
# file; the owner DSN still only ever lives in the runner's tmpfs file (review N2).
# HYPERSOAR_LAB_MODE (sandbox or production, from the stack's deca.env) is the install mode the owner job
# migrates the database as; a production database refuses to be opened in sandbox mode and the reverse.
services:
  owner-job:
    environment:
      HYPERSOAR_ENV: lab
      HYPERSOAR_MODE: ${HYPERSOAR_LAB_MODE:?sandbox or production}
    secrets: [deca_db_ca]
    networks: [deca]

networks:
  deca:
    external: true
    name: ${HYPERSOAR_LAB_PROJECT:-deca-lab}_deca

secrets:
  deca_db_ca: {file: "${HYPERSOAR_ETC:-/etc/deca-soar}/tls/db-ca.pem"}
