      AWS_SECRET_ACCESS_KEY: ${DECA_OSS_ACCESS_KEY_SECRET:?bucket-scoped OSS RAM user}
      AWS_DEFAULT_REGION: ${DECA_OSS_REGION:-ap-southeast-5}
      TRACECAT__BLOB_STORAGE_PRESIGNED_URL_ENDPOINT: ${TRACECAT__BLOB_STORAGE_PRESIGNED_URL_ENDPOINT:?OSS endpoint reachable
        by SOAR engineers}
    volumes:
    - ${TRACECAT__LOCAL_REPOSITORY_PATH}:/app/local_registry
    - sandbox-cache:/var/lib/tracecat/sandbox-cache
    command:
    - python
    - -m
    - tracecat.executor.worker
    depends_on:
      migrations:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
  ui:
    image: ghcr.io/tracecathq/tracecat-ui:1.5.2
    restart: unless-stopped
    networks:
    - core
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_AUTH_TYPES: ${TRACECAT__AUTH_TYPES}
      NEXT_SERVER_API_URL: ${NEXT_SERVER_API_URL}
      NODE_ENV: production
      TRACECAT__CSP_CONNECT_SRC_ORIGINS: ${TRACECAT__BLOB_STORAGE_PRESIGNED_URL_ENDPOINT:?OSS endpoint}
      TRACECAT__SERVICE_KEY: ${TRACECAT__SERVICE_KEY:?set in the secret env file}
    depends_on:
    - api
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    security_opt:
    - no-new-privileges:true
  migrations:
    image: ghcr.io/tracecathq/tracecat:1.5.2
    restart: 'no'
    networks:
    - core
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      TRACECAT__LOG_FORMAT: ${TRACECAT__LOG_FORMAT:-console}
      TRACECAT__DB_URI: ${TRACECAT__DB_URI:?RDS URI (postgresql+psycopg://...)}
      TRACECAT__DB_MIGRATOR_URI: ${TRACECAT__DB_MIGRATOR_URI:-}
      TRACECAT__DB_ADMIN_URI: ${TRACECAT__DB_ADMIN_URI:-}
      TRACECAT__DB_MIGRATOR_PASSWORD: ${TRACECAT__DB_MIGRATOR_PASSWORD:-}
      TRACECAT__DB_APP_PASSWORD: ${TRACECAT__DB_APP_PASSWORD:-}
      TRACECAT__DB_ROLE_LOGIN: ${TRACECAT__DB_ROLE_LOGIN:-}
      TRACECAT__DB_SSLMODE: ${TRACECAT__DB_SSLMODE:-require}
      TRACECAT__FEATURE_FLAGS: ''
      ENTERPRISE_EDITION: 'false'
      TRACECAT__EE_MULTI_TENANT: 'false'
      TRACECAT__APP_ENV: production
      TRACECAT__PLATFORM_ADMIN_MFA_BYPASS: 'false'
      TRACECAT__PLATFORM_ADMIN_IP_ALLOWLIST_BYPASS: 'false'
      TRACECAT__UNSAFE_DISABLE_SECRET_ERROR_WITHHOLDING: 'false'
    command:
    - sh
    - -ec
    - "if [ -n \"$${TRACECAT__DB_ROLE_LOGIN}\" ]; then\n  python3 -m tracecat.db.roles upgrade --login \"$${TRACECAT__DB_ROLE_LOGIN}\"\
      \nfi\n# The migrations get migrator's login only, never the admin's.\n(\n  unset TRACECAT__DB_ADMIN_URI TRACECAT__DB_MIGRATOR_PASSWORD\
      \ TRACECAT__DB_APP_PASSWORD\n  if [ -n \"$${TRACECAT__DB_MIGRATOR_URI}\" ]; then\n    export TRACECAT__DB_URI=\"$${TRACECAT__DB_MIGRATOR_URI}\"\
      \n  fi\n  exec python3 -m tracecat.db.roles migrate\n)\n# Again once the schema exists: installs the dynamic-table RLS\
      \ guard on a new install.\nif [ -n \"$${TRACECAT__DB_ROLE_LOGIN}\" ]; then\n  python3 -m tracecat.db.roles upgrade --login\
      \ \"$${TRACECAT__DB_ROLE_LOGIN}\"\nfi\n"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
  temporal:
    image: temporalio/auto-setup:1.27.1
    restart: unless-stopped
    networks:
    - core
    - temporal
    environment:
      DB: postgres12
      DB_PORT: ${TEMPORAL__POSTGRES_PORT:-5432}
      POSTGRES_SEEDS: ${TEMPORAL__POSTGRES_SEEDS:?RDS host for Temporal}
      POSTGRES_USER: ${TEMPORAL__POSTGRES_USER:?RDS user for Temporal}
      POSTGRES_PWD: ${TEMPORAL__POSTGRES_PASSWORD:?set in the secret env file}
      DBNAME: ${TEMPORAL__POSTGRES_DB:-temporal}
      VISIBILITY_DBNAME: ${TEMPORAL__POSTGRES_VISIBILITY_DB:-temporal_visibility}
      SQL_TLS_ENABLED: ${TEMPORAL__POSTGRES_TLS:-true}
      DEFAULT_NAMESPACE_RETENTION: ${TEMPORAL__DEFAULT_NAMESPACE_RETENTION:-72h}
      LOG_LEVEL: warn
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
    healthcheck:
      test:
      - CMD
      - tctl
      - --address
      - temporal:7233
      - cluster
      - health
      interval: 5s
      timeout: 10s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
volumes:
  sandbox-cache: null
networks:
  core: null
  temporal: null
